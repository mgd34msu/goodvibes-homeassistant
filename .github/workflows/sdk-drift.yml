name: SDK drift

# Turns red when the integration's "validated against SDK X" claim falls behind
# the published @pellux/goodvibes-sdk release.
#
# This is deliberately NOT part of ci.yml. The drift check depends on npm's
# publish cadence rather than on anything in a given commit, so gating pushes,
# pull requests or the auto-release on it would block this repo's releases on an
# unrelated repo's publishes. It runs on a schedule instead, so a stale claim
# shows up as a red run in the Actions list rather than as an informational
# notice buried in a passing job's log — which is how the claim sat at 1.15.0
# while the daemon moved through 1.16.0, 1.16.1, 1.17.0, 1.17.1 and 1.17.2.
#
# To clear a failure, re-run the live validation and refresh the pin:
#   bun scripts/validate-daemon-contract.mjs <new version>
# then re-vendor generated_client.py, update const.SDK_VALIDATED_VERSION and
# docs/sdk-compatibility.md. See docs/sdk-compatibility.md.

on:
  schedule:
    # Weekly, Mondays 08:00 UTC.
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  # Only this workflow gets it: a scheduled run has nobody watching, so it files
  # its own report. See the "Report the failure as an issue" step.
  issues: write

concurrency:
  group: sdk-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Validated SDK version vs npm latest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - name: Verify the vendored SDK client has not been hand-edited
        run: |
          set -euo pipefail
          # The version comparison below reads version strings out of the
          # vendored file, which a hand-edit anywhere else in it would leave
          # untouched. This checks the whole file.
          sha256sum -c tests/generated_client.sha256

      - name: Compare the validated pin against npm latest
        run: |
          set -euo pipefail

          validated=$(python3 - <<'PY'
          import pathlib
          import re

          text = pathlib.Path("custom_components/goodvibes/const.py").read_text()
          match = re.search(r'^SDK_VALIDATED_VERSION = "([^"]+)"$', text, re.MULTILINE)
          print(match.group(1) if match else "")
          PY
          )
          contract=$(python3 - <<'PY'
          import pathlib
          import re

          text = pathlib.Path("custom_components/goodvibes/generated_client.py").read_text()
          match = re.search(r'^CONTRACT_VERSION: str = "([^"]+)"$', text, re.MULTILINE)
          print(match.group(1) if match else "")
          PY
          )
          latest=$(npm view @pellux/goodvibes-sdk version)

          echo "validated against : ${validated}"
          echo "vendored contract : ${contract}"
          echo "npm latest        : ${latest}"

          {
            echo "| | version |"
            echo "|---|---|"
            echo "| Validated against | \`${validated}\` |"
            echo "| Vendored contract | \`${contract}\` |"
            echo "| npm latest | \`${latest}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${validated}" ] || [ -z "${contract}" ]; then
            echo "::error::Could not read SDK_VALIDATED_VERSION or CONTRACT_VERSION."
            exit 1
          fi

          if [ "${validated}" != "${contract}" ]; then
            echo "::error::const.SDK_VALIDATED_VERSION (${validated}) does not match the vendored generated_client.py contract (${contract})."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The validation claim does not match the vendored artifact." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "${validated}" != "${latest}" ]; then
            echo "::error::The integration is validated against ${validated} but @pellux/goodvibes-sdk latest is ${latest}. Re-run 'bun scripts/validate-daemon-contract.mjs ${latest}', re-vendor generated_client.py, and refresh const.SDK_VALIDATED_VERSION plus docs/sdk-compatibility.md."
            {
              echo ""
              echo "**Drift:** validated against \`${validated}\`, but npm latest is \`${latest}\`."
              echo ""
              echo "To clear:"
              echo '```'
              echo "bun scripts/validate-daemon-contract.mjs ${latest}"
              echo '```'
              echo "then re-vendor \`generated_client.py\`, update \`const.SDK_VALIDATED_VERSION\` and \`docs/sdk-compatibility.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "No drift: validated against ${validated}, which is npm latest."

      - name: Report the failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "SDK drift: the validated pin needs attention"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # This workflow runs on a schedule, so a red run notifies nobody and
          # just sits in the Actions list. File it where it will be seen.
          #
          # Deduped by exact title so a weekly failure comments on the existing
          # issue instead of opening a new one every Monday. Closing the issue
          # is the signal that it was dealt with; the next failure reopens the
          # cycle by creating a fresh one.
          body=$(
            printf '%s\n' \
              "The scheduled \`SDK drift\` workflow failed." \
              "" \
              "Run: ${RUN_URL}" \
              "" \
              "One of these is true:" \
              "" \
              "- \`custom_components/goodvibes/generated_client.py\` no longer matches the hash recorded in \`tests/generated_client.sha256\` (the vendored client was hand-edited)." \
              "- \`const.SDK_VALIDATED_VERSION\` disagrees with the vendored contract version." \
              "- The validated pin has fallen behind \`@pellux/goodvibes-sdk\` on npm." \
              "" \
              "The run's step summary says which. See \`docs/sdk-compatibility.md\` to clear it."
          )
          existing=$(
            gh issue list --state open --limit 100 --json number,title \
              | TITLE="${TITLE}" python3 -c \
                'import json, os, sys; print(next((str(i["number"]) for i in json.load(sys.stdin) if i["title"] == os.environ["TITLE"]), ""))'
          )
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
            echo "Commented on existing issue #${existing}."
          else
            gh issue create --title "${TITLE}" --body "${body}"
          fi
